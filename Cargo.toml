[package]
name = "duplicate_cleaner"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
walkdir = "2.4.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
opener = "0.7.2"
chrono = "0.4.38"

[build-dependencies]
winres = "0.1.12"